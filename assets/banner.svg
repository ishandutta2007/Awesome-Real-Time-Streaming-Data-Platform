<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="streamLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flowLine {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 8px #38BDF8); }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0); }
    }

    .bg-rect { fill: url(#bgGradient); }
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    
    .stream-path {
      fill: none;
      stroke: url(#streamLineGrad);
      stroke-width: 3;
      stroke-dasharray: 20 10;
      animation: flowLine 15s linear infinite;
    }

    .stream-path-fast {
      fill: none;
      stroke: #38BDF8;
      stroke-width: 2;
      stroke-dasharray: 8 16;
      animation: flowLine 6s linear infinite;
    }

    .pulse-dot {
      animation: pulseNode 3s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .wave-bg {
      animation: waveMove 8s ease-in-out infinite;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGradient);
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94A3B8;
    }

    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38BDF8;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" class="bg-rect" />

  <!-- Dynamic Grid Lines -->
  <g class="grid">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="320" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="320" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="320" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="320" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="320" class="grid-line" />
  </g>

  <!-- Animated Stream Flow Paths (Background Elements) -->
  <g class="wave-bg">
    <path d="M -50 220 Q 200 150 450 230 T 950 180 T 1250 250" class="stream-path" />
    <path d="M -50 250 Q 250 290 550 210 T 1050 260 T 1250 200" class="stream-path-fast" opacity="0.6" />
  </g>

  <!-- Animated Nodes/Pulsing Data Connections (Background/Sides) -->
  <g>
    <!-- Node 1 -->
    <circle cx="150" cy="230" r="6" fill="#38BDF8" class="pulse-dot" />
    <circle cx="150" cy="230" r="14" fill="#38BDF8" opacity="0.2" />

    <!-- Node 2 -->
    <circle cx="450" cy="230" r="7" fill="#818CF8" class="pulse-dot" style="animation-delay: 1s;" />
    <circle cx="450" cy="230" r="16" fill="#818CF8" opacity="0.2" />

    <!-- Node 3 -->
    <circle cx="950" cy="180" r="8" fill="#C084FC" class="pulse-dot" style="animation-delay: 2s;" />
    <circle cx="950" cy="180" r="18" fill="#C084FC" opacity="0.2" />
  </g>

  <!-- FOREGROUND LAYER: Title & Subtitle (Always crisp & on top) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill / Tag -->
    <rect x="0" y="48" width="280" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="16" cy="62" r="4" fill="#10B981" />
    <text x="30" y="66" class="badge-text">⚡ REAL-TIME DATA PLATFORMS</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title-text" filter="url(#glow)">Awesome Real-Time Streaming</text>
    <text x="0" y="180" class="title-text">Data Platform Ecosystem 🚀</text>

    <!-- Subtitle -->
    <text x="0" y="225" class="subtitle-text">Curated guide to SaaS &amp; Open-Source Event Streaming, Message Brokers,</text>
    <text x="0" y="250" class="subtitle-text">Change Data Capture (CDC) &amp; Stateful Stream Processing Engines.</text>
  </g>

  <!-- Right Decorative Network Graphic (Foreground Right) -->
  <g transform="translate(920, 70)" opacity="0.85">
    <rect x="0" y="0" width="200" height="180" rx="12" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <!-- Mini Architecture Diagram -->
    <rect x="20" y="30" width="45" height="35" rx="6" fill="#0EA5E9" fill-opacity="0.3" stroke="#0EA5E9" />
    <text x="28" y="52" fill="#E0F2FE" font-size="10" font-family="sans-serif" font-weight="bold">SOURCES</text>

    <line x1="65" y1="47.5" x2="95" y2="47.5" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3 3" />

    <rect x="95" y="25" width="55" height="45" rx="6" fill="#6366F1" fill-opacity="0.4" stroke="#6366F1" />
    <text x="101" y="52" fill="#EEF2FF" font-size="10" font-family="sans-serif" font-weight="bold">STREAM</text>

    <line x1="122.5" y1="70" x2="122.5" y2="105" stroke="#818CF8" stroke-width="2" stroke-dasharray="3 3" />

    <rect x="95" y="105" width="55" height="45" rx="6" fill="#A855F7" fill-opacity="0.4" stroke="#A855F7" />
    <text x="103" y="132" fill="#F3E8FF" font-size="10" font-family="sans-serif" font-weight="bold">ENGINE</text>

    <circle cx="122.5" cy="47.5" r="3" fill="#38BDF8" class="pulse-dot" />
    <circle cx="122.5" cy="87.5" r="3" fill="#818CF8" class="pulse-dot" style="animation-delay: 1.5s;" />
  </g>
</svg>
